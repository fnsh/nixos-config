filter export_v4_thumbdrive {
  # Wait until Route issue fixed
  # Netcom Kassel for example
  # bgp_community.add((65535,65282));

  # Don't distribute to NL-IX (Prefer Configo)
  bgp_community.add((0,34307));

  if net = 194.180.249.0/24 then accept;
  reject;
}

filter export_v6_thumbdrive {
  # Wait until Route issue fixed
  # Netcom Kassel for example
  # bgp_community.add((65535,65282));

  # Don't distribute to NL-IX (Prefer Configo)
  bgp_community.add((0,34307));

  if net = 2a13:fcc0::/29 then accept;
  reject;
}

filter import_thumbdrive {
  bgp_med = 21;
  if bgp_path.first = bgp_path.last then {
    # Directly connected
    bgp_local_pref = 200;
  }
  if (64475,300) ~ bgp_community then {
    # Directly connected
    bgp_local_pref = 200;
  }
  accept;
}

template bgp thumbdrive {
  interface "cix-peer";
  vrf "vrf-as62028";
  direct;

  med metric on;
  default bgp_med 0;

  ipv4 {
    import filter import_thumbdrive;
    export filter export_v4_thumbdrive;
  };

  ipv6 {
    import filter import_thumbdrive;
    export filter export_v6_thumbdrive;
  };
}

protocol bgp peering_thumbdrive_v4 from thumbdrive {
  local 185.1.74.74 as 62028;
  neighbor 185.1.74.40 as 64475;
}

protocol bgp peering_thumbdrive_v6 from thumbdrive {
