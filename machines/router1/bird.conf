log syslog all;
timeformat protocol iso long;

router id 10.42.20.1;

protocol device {
  scan time 10;
}

protocol kernel kernel_table_v4 {
  ipv4 {
    export all;
    import none;
  };
  persist;
  scan time 10;
  kernel table 100;
}

protocol kernel kernel_table_v6 {
  ipv6 {
    export all;
    import none;
  };
  persist;
  scan time 10;
  kernel table 100;
}

protocol static static_origin_v4 {
  ipv4;
  route 194.180.249.0/24 blackhole;
}

protocol static static_origin_v6 {
  ipv6;
  route 2a13:fcc0::/29 blackhole;
}

protocol static frontend_v4 {
  ipv4;
  route 194.180.249.0/27 via "frontend";
}

protocol static frontend_v6 {
  ipv6;
  route 2a13:fcc0:ebbe:1:401:1000:110::/112 via "frontend";
}

protocol static neanderfunk_v4 {
  ipv4;
  route 194.180.249.40/29 via "neanderfunk";
}

protocol static neanderfunk_v6 {
  ipv6;
  route 2a13:fcc0:3000:300::/64 via "neanderfunk";
}

protocol static neanderfunk_clientnet_v6 {
  ipv6;
  route 2a13:fcc0:2f00::/48 via  2a13:fcc0:3000:300:100::1 dev "neanderfunk";
}

filter export_v4 {
  if net = 194.180.249.0/24 then accept;
  reject;
}

filter export_v6 {
  if net = 2a13:fcc0::/29 then accept;
  reject;
}

# ===========
# BGP Configo
# ===========

filter export_v4_configo {
  # Avoid route usage for Lumen
  bgp_community.add((3356,70));
  if net = 194.180.249.0/24 then accept;
  reject;
}

filter export_v6_configo {
  # Avoid route usage for Lumen
  bgp_community.add((3356,70));
  if net = 2a13:fcc0::/29 then accept;
  reject;
}

filter import_configo {
  bgp_med = 150;
  if bgp_path.len <= 1 then {
    # Directly connected
    bgp_local_pref = 200;
  } else if (34154,180) ~ bgp_community then {
    # Transit
    bgp_local_pref = 50;
  } else {
    # Peering (34154,200) / Customer
    bgp_med = 20;
  }
  accept;
}

protocol bgp peering_configo_v4 {
  local 217.71.220.139 as 62028;
  neighbor 217.71.220.138 as 34154;
  interface "configo-peer";
  vrf "vrf-as62028";
  direct;

  med metric on;
  default bgp_med 150;

  ipv4 {
    import filter import_configo;
    export filter export_v4_configo;
  };
}

protocol bgp peering_configo_v6 {
  local 2a00:1fe8:1::39 as 62028;
  neighbor 2a00:1fe8:1::38 as 34154;
  interface "configo-peer";
  vrf "vrf-as62028";
  direct;

  med metric on;
  default bgp_med 150;

  ipv6 {
    import filter import_configo;
    export filter export_v6_configo;
  };
}

# =============
# BGP Interlink
# =============

filter export_interlink_v4 {
  # Prepend 3x Entega MUC
  bgp_large_community.add((47228,103,12897));

  # Prepend 3x Entega HAM
  bgp_large_community.add((43252,103,12897));

  # Prepend 3x Entega AMS
  bgp_large_community.add((6777,103,12897));

  # Prepend 2x DE-CIX RS
  bgp_large_community.add((5405,1002,6695));

  # Prepend 2x Cloudflare
  bgp_large_community.add((5405,1002,13335));

  # Prepend 2x Fastly
  bgp_large_community.add((5405,1002,54113));

  # Prepend 2x Google
  bgp_large_community.add((5405,1002,15169));

  if net = 194.180.249.0/24 then accept;
  reject;
}

filter export_interlink_v6 {
  # Prepend 3x Entega MUC
  bgp_large_community.add((47228,103,12897));

  # Prepend 3x Entega HAM
  bgp_large_community.add((43252,103,12897));

  # Prepend 3x Entega AMS
  bgp_large_community.add((6777,103,12897));

  # Prepend 2x DE-CIX RS
  bgp_large_community.add((5405,1002,6695));

  # Prepend 2x Cloudflare
  bgp_large_community.add((5405,1002,13335));

  # Prepend 2x Fastly
  bgp_large_community.add((5405,1002,54113));

  # Prepend 2x Google
  bgp_large_community.add((5405,1002,15169));

  if net = 2a13:fcc0::/29 then accept;
  reject;
}

filter import_interlink {
  bgp_med = 100;
  if bgp_path.len <= 1 then {
    # Directly connected
    bgp_local_pref = 200;
  } else if (5405,2) ~ bgp_community then {
    # Transit
    bgp_med = 210;
  } else if (5405,3008) ~ bgp_community then {
    # Learned in FRA
    bgp_med = 23;
  } else {
    # Peering / Customer
    bgp_med = 51;
  }
  accept;
}

protocol bgp peering_interlink_v4 {
  local 81.27.69.85 as 62028;
  neighbor 81.27.69.84 as 5405;
  interface "interlink-peer";
  vrf "vrf-as62028";
  direct;

  med metric on;
  default bgp_med 100;

  ipv4 {
    import filter import_interlink;
    export filter export_interlink_v4;
  };
}

protocol bgp peering_interlink_v6 {
  local 2a11:4140:9002::31 as 62028;
  neighbor 2a11:4140:9002::30 as 5405;
  interface "interlink-peer";
  vrf "vrf-as62028";
  direct;

  med metric on;
  default bgp_med 100;

  ipv6 {
    import filter import_interlink;
    export filter export_interlink_v6;
  };
}

# ===========================
# BGP CommunityIX Routeserver
# ===========================

filter export_v4_cix {
  # Don't announce at DE-CIX to prefer FFFFM
  bgp_community.add((47147,3702));
  if net = 194.180.249.0/24 then accept;
  reject;
}

filter export_v6_cix {
  # Don't announce at DE-CIX to prefer FFFFM
  bgp_community.add((47147,3702));
  if net = 2a13:fcc0::/29 then accept;
  reject;
}

filter import_communityix {
  bgp_med = 50;
  if bgp_path.len <= 1 then {
    # Directly connected
    bgp_local_pref = 200;
  } else if bgp_path.first = 3320 then {
    # Peer DTAG - Transit
    bgp_med = 10000;
  } else if (47147,2300) ~ bgp_community then {
    # Peer Anexia - Transit
    bgp_med = 200;
  } else if (47147,2401) ~ bgp_community then {
    # Peer Anexia - Peering FRA
    bgp_med = 22;
  } else if (47147:2301) ~ bgp_community then {
    # Peer Anexia - Peering
    bgp_med = 50;
  } else {
    # Default
  }
  accept;
}

template bgp cix {
  interface "cix-peer";
  vrf "vrf-as62028";
  direct;

  med metric on;
  default bgp_med 50;

  ipv4 {
    gateway direct;
    next hop keep;
    next hop self;
    add paths rx;
    import keep filtered;
    import filter import_communityix;
    export filter export_v4_cix;
  };

  ipv6 {
    gateway direct;
    next hop keep;
    next hop self;
    add paths rx;
    import keep filtered;
    import filter import_communityix;
    export filter export_v6_cix;
  };
}

protocol bgp peering_communityix_rs1_v4 from cix {
  local 185.1.74.74 as 62028;
  neighbor 185.1.74.1 as 57555;
}

protocol bgp peering_communityix_rs1_v6 from cix {
  local 2001:7f8:a5::6:2028:1 as 62028;
  neighbor 2001:7f8:a5::5:7555:1 as 57555;
}

protocol bgp peering_communityix_rs2_v4 from cix {
  local 185.1.74.74 as 62028;
  neighbor 185.1.74.2 as 57555;
}

protocol bgp peering_communityix_rs2_v6 from cix {
  local 2001:7f8:a5::6:2028:1 as 62028;
  neighbor 2001:7f8:a5::5:7555:2 as 57555;
}

# ==========
# BGP LWLCOM
# ==========

filter import_lwlcom {
  bgp_med = 50;
  if bgp_path.len <= 1 then {
    # Directly connected
    bgp_local_pref = 200;
  }
  accept;
}

template bgp lwlcom {
  interface "cix-peer";
  vrf "vrf-as62028";
  direct;

  med metric on;
  default bgp_med 50;

  disabled;

  ipv4 {
    import filter import_lwlcom;
    export filter export_v4;
    next hop self;
  };

  ipv6 {
    import filter import_lwlcom;
    export filter export_v6;
    next hop self;
  };
}

protocol bgp peering_lwlcom_v4 from lwlcom {
  local 185.1.74.74 as 62028;
  neighbor 185.1.74.30 as 50629;
}

protocol bgp peering_lwlcom_v6 from lwlcom {
  local 2001:7f8:a5::6:2028:1 as 62028;
  neighbor 2001:7f8:a5::5:629:3 as 50629;
}

