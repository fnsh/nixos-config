name: "Build"
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE.txt'

concurrency:
  # yamllint disable rule:line-length
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event.pull_request.number || github.run_id }}
  # yamllint enable rule:line-length
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hostname:
          - gw1
          - gw2
          - gw3
          - gw4
          - gw5
          - gw6
          - gw7
          - gw8
          - router1
          - nat64
          - monitoring
          - collector
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v14
      with:
        name: fnsh
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix build --accept-flake-config --print-out-paths '.#nixosConfigurations."${{ matrix.hostname }}".config.system.build.toplevel'

