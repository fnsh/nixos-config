name: "Build"
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE.txt'

concurrency:
  # yamllint disable rule:line-length
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event.pull_request.number || github.run_id }}
  # yamllint enable rule:line-length
  cancel-in-progress: true

jobs:
  targets:
    outputs:
      attrPaths: ${{ steps.get-targets.outputs.attrPaths }}
    runs-on: ubuntu-26.04
    name: Get outputs to build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: fnsh
          # If you chose API tokens for write access OR if you have a private cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Get Targets
        id: get-targets
        run: |
          attrs=$(nix eval --accept-flake-config --json .#cacheOutputs)
          echo 'Identified these output attrs:'
          echo "$attrs" | jq .
          echo "attrPaths=$attrs" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-26.04
    needs:
      - targets
    strategy:
      fail-fast: false
      matrix:
        attrPath: ${{ fromJSON(needs.targets.outputs.attrPaths) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        name: fnsh
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix build --accept-flake-config --print-out-paths '.#${{ matrix.attrPath }}'

